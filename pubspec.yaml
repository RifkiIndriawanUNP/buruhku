name: buruhku
description: Buruhku - marketplace jasa buruh harian lepas (prototype lokal, tanpa backend).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  image_picker: ^1.2.4
  latlong2: ^0.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
